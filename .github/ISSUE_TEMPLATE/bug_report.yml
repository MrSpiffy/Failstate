name: Bug report
description: Report a reproducible gameplay, generation, or editor problem.
title: "[Bug] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: Checkout and environment
      description: Branch/commit, local changes, Unity version, and OS.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the location, generation settings/seed, relay state, and any developer commands used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, inventory/integrity values, Console errors, and whether a fresh session reproduces it.
